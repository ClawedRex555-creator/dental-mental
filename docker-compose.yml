services:
  postgres:
    image: postgres:16-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_USER: mis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dentalcloud
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./db/docker-init-migrations.sh:/docker-entrypoint-initdb.d/02-migrations.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mis -d dentalcloud"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: emkaro-app:${EMKARO_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        APP_ROOT_DOMAIN: ${APP_ROOT_DOMAIN:-emkaro.ru}
        CACHEBUST: ${DEPLOY_VERSION:-unknown}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      NODE_ENV: production
      DEPLOY_VERSION: ${DEPLOY_VERSION:-unknown}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      ENABLE_DEMO_ACCOUNTS: "false"
      DATABASE_URL: postgresql://mis:${POSTGRES_PASSWORD}@postgres:5432/dentalcloud
      APP_ROOT_DOMAIN: ${APP_ROOT_DOMAIN:?set APP_ROOT_DOMAIN in .env}
      PHI_ENCRYPTION_KEY: ${PHI_ENCRYPTION_KEY:?set PHI_ENCRYPTION_KEY in .env}
      TLS_ASK_SECRET: ${TLS_ASK_SECRET:-}
      SUPERADMIN_LOGIN: ${SUPERADMIN_LOGIN:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      EGISZ_GATEWAY_URL: ${EGISZ_GATEWAY_URL:-}
      EGISZ_ENV: ${EGISZ_ENV:-test}
      EGISZ_SYSTEM_ID: ${EGISZ_SYSTEM_ID:-}
      EGISZ_PRODUCT_NAME: ${EGISZ_PRODUCT_NAME:-Emkaro}
      EGISZ_N3_STUB: ${EGISZ_N3_STUB:-true}
      EGISZ_CRON_SECRET: ${EGISZ_CRON_SECRET:-}
      MEDFLEX_CRON_SECRET: ${MEDFLEX_CRON_SECRET:-}
      EGISZ_WEBHOOK_SECRET: ${EGISZ_WEBHOOK_SECRET:-}
      EGISZ_SIGNING_URL: ${EGISZ_SIGNING_URL:-}
      EGISZ_SIGNING_SECRET: ${EGISZ_SIGNING_SECRET:-}
      NOTIFICATIONS_CRON_SECRET: ${NOTIFICATIONS_CRON_SECRET:-}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-}
      NOTIFICATIONS_MOCK_FAIL: ${NOTIFICATIONS_MOCK_FAIL:-0}
      NOTIFICATIONS_TELEGRAM_BOT_TOKEN: ${NOTIFICATIONS_TELEGRAM_BOT_TOKEN:-}
      NOTIFICATIONS_WHATSAPP_ACCESS_TOKEN: ${NOTIFICATIONS_WHATSAPP_ACCESS_TOKEN:-}
      NOTIFICATIONS_WHATSAPP_PHONE_NUMBER_ID: ${NOTIFICATIONS_WHATSAPP_PHONE_NUMBER_ID:-}
      NOTIFICATIONS_WHATSAPP_API_URL: ${NOTIFICATIONS_WHATSAPP_API_URL:-}
      NOTIFICATIONS_SMS_API_URL: ${NOTIFICATIONS_SMS_API_URL:-}
      NOTIFICATIONS_SMS_API_KEY: ${NOTIFICATIONS_SMS_API_KEY:-}
      NOTIFICATIONS_SMS_SENDER: ${NOTIFICATIONS_SMS_SENDER:-}
      NOTIFICATIONS_SMTP_URL: ${NOTIFICATIONS_SMTP_URL:-}
      NOTIFICATIONS_SMTP_API_KEY: ${NOTIFICATIONS_SMTP_API_KEY:-}
      NOTIFICATIONS_EMAIL_FROM: ${NOTIFICATIONS_EMAIL_FROM:-}
      NOTIFICATIONS_VK_ACCESS_TOKEN: ${NOTIFICATIONS_VK_ACCESS_TOKEN:-}
      NOTIFICATIONS_MAX_API_TOKEN: ${NOTIFICATIONS_MAX_API_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      DADATA_API_TOKEN: ${DADATA_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/api/health',(r)=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>process.exit(d.includes('patientAppointmentSearch')?0:1))}).on('error',()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  notifications-cron:
    image: curlimages/curl:8.10.1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      app:
        condition: service_healthy
    environment:
      NOTIFICATIONS_CRON_SECRET: ${NOTIFICATIONS_CRON_SECRET:-}
    command:
      - sh
      - -ceu
      - |
        SECRET="$${NOTIFICATIONS_CRON_SECRET}"
        if [ -z "$$SECRET" ]; then
          echo "notifications-cron: NOTIFICATIONS_CRON_SECRET required, disabled"
          sleep infinity
        fi
        while true; do
          curl -fsS -X POST "http://app:3000/api/notifications/process" \
            -H "Authorization: Bearer $$SECRET" \
            -H "Content-Type: application/json" \
            -d '{}' >/dev/null || echo "notifications-cron: tick failed"
          sleep 60
        done
    restart: unless-stopped

  medflex-cron:
    image: curlimages/curl:8.10.1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      app:
        condition: service_healthy
    environment:
      MEDFLEX_CRON_SECRET: ${MEDFLEX_CRON_SECRET:-}
      EGISZ_CRON_SECRET: ${EGISZ_CRON_SECRET:-}
    command:
      - sh
      - -ceu
      - |
        SECRET="$${MEDFLEX_CRON_SECRET:-$${EGISZ_CRON_SECRET}}"
        if [ -z "$$SECRET" ]; then
          echo "medflex-cron: MEDFLEX_CRON_SECRET or EGISZ_CRON_SECRET required, disabled"
          sleep infinity
        fi
        echo "medflex-cron: pushing schedule every 15 minutes"
        while true; do
          curl -fsS -X POST "http://app:3000/api/medflex/process" \
            -H "Authorization: Bearer $$SECRET" \
            -H "Content-Type: application/json" \
            -d '{}' >/dev/null || echo "medflex-cron: tick failed"
          sleep 900
        done
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_ROOT_DOMAIN: ${APP_ROOT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@${APP_ROOT_DOMAIN}}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pg-data:
  app-data:
  caddy-data:
  caddy-config:
  # ВАЖНО: pg-data — постоянное хранилище PostgreSQL.
  # Не запускайте `docker compose down -v` — флаг -v удалит volumes и все данные.
